[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-multiplatform = "1.12.2"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.5.0"
zxing = "3.5.4"
zxing-embedded = "4.3.0"
activity-compose = "1.13.0"
core-ktx = "1.19.1"
javamail = "1.6.8"
activation = "1.2.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-embedded" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
javamail = { module = "com.sun.mail:jakarta.mail", version.ref = "javamail" }
jakarta-activation = { module = "com.sun.activation:jakarta.activation", version.ref = "activation" }
android-mail = { module = "com.sun.mail:android-mail", version.ref = "javamail" }
android-activation = { module = "com.sun.mail:android-activation", version.ref = "javamail" }
anthropic-java = { module = "com.anthropic:anthropic-java", version = "2.73.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
